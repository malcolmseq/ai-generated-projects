<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Map</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
    }

    .map-container {
      display: flex;
      justify-content: center;
      width: 100%;
      overflow: hidden;
    }

    img {
      display: block;
      max-width: 50%;
      height: auto;
    }

    .map-controls {
      position: fixed;
      top: 50%;
      right: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transform: translateY(-50%);
    }

    .map-controls button {
      width: 2.75rem;
      height: 2.75rem;
      border: 1px solid #888;
      border-radius: 0.35rem;
      background: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .map-controls button:focus-visible {
      outline: 3px solid #2673d9;
      outline-offset: 2px;
    }

    .pan-controls {
      display: grid;
      grid-template-columns: repeat(3, 2.75rem);
      gap: 0.25rem;
    }

    .pan-controls button:first-child {
      grid-column: 2;
    }

    .pan-controls button:nth-child(2) {
      grid-column: 1;
      grid-row: 2;
    }

    .pan-controls button:nth-child(3) {
      grid-column: 2;
      grid-row: 2;
    }

    .pan-controls button:nth-child(4) {
      grid-column: 3;
      grid-row: 2;
    }
  </style>
</head>
<body>
  <main class="map-container">
    <img id="map" src="build/test.png" alt="Live map">
  </main>
  <nav class="map-controls" aria-label="Map controls">
    <button type="button" data-route="/zoom/increment" aria-label="Zoom in" title="Zoom in">+</button>
    <button type="button" data-route="/zoom/decrement" aria-label="Zoom out" title="Zoom out">−</button>
    <div class="pan-controls" role="group" aria-label="Map pan controls">
      <button type="button" data-route="/pan/top" aria-label="Pan up" title="Pan up">↑</button>
      <button type="button" data-route="/pan/left" aria-label="Pan left" title="Pan left">←</button>
      <button type="button" data-route="/pan/bottom" aria-label="Pan down" title="Pan down">↓</button>
      <button type="button" data-route="/pan/right" aria-label="Pan right" title="Pan right">→</button>
    </div>
  </nav>
  <script>
    const map = document.getElementById("map");
    const imageUrl = new URL(map.src);

    document.querySelectorAll("[data-route]").forEach((button) => {
      button.addEventListener("click", () => {
        fetch(button.dataset.route, { cache: "no-store" }).then((response) => {
          if (!response.ok) {
            throw new Error(`Map control failed: HTTP ${response.status}`);
          }
        }).catch((error) => {
          console.error(error);
        });
      });
    });

    setInterval(() => {
      imageUrl.searchParams.set("refresh", Date.now());
      map.src = imageUrl.toString();
    }, 500);
  </script>
</body>
</html>
